[project]
name = "rental-lookup"
version = "0.1.0"
description = "Scrape, score and map Bangalore rental listings (NoBroker + MagicBricks)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The rental-map contributors" }]
keywords = ["rental", "real-estate", "bangalore", "scraper", "leaflet", "openstreetmap"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "osmnx>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "shapely>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only for the experimental rental_lookup.sources.facebook
facebook = ["facebook-scraper>=0.2.59"]
# Chrome SSR fallback when the 99acres JSON API is blocked (401/403).
acres99 = ["playwright>=1.40"]
# Preferred 99acres path when APIFY_TOKEN is set (Akamai-resistant, paid per listing).
acres99-apify = ["apify-client>=1.8"]

[project.scripts]
rental-map-fetch = "rental_lookup.sources.__main__:main"
rental-map-rank = "rental_lookup.__main__:main"
rental-map-build = "rental_lookup.webmap.builder:main"
rental-map-serve = "rental_lookup.webmap.server:main"
rental-map-dev = "rental_lookup.webmap.dev:main"

[project.urls]
Homepage = "https://github.com/sarweshshah/rental-map"
Issues = "https://github.com/sarweshshah/rental-map/issues"

[tool.setuptools.packages.find]
include = ["rental_lookup*"]

[tool.setuptools.package-data]
"rental_lookup.webmap" = ["template.html", "ui/**/*.html", "ui/**/*.css", "ui/**/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:rental_lookup",
    # pyproj 3.6 (the last release for Python 3.9) + numpy 2; fixed in pyproj 3.7
    "ignore:Conversion of an array with ndim > 0 to a scalar:DeprecationWarning:pyproj",
]

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string
build-backend = "setuptools.build_meta"
