<div class="rank-tabs" role="tablist" aria-label="Rank by">
    <button
        class="rank-tab on"
        id="rank-quality"
        onclick="setRankMode('quality')"
        title="General desirability"
    >
        <span data-icon="sparkles"></span>Quality
    </button>
    <button
        class="rank-tab"
        id="rank-value"
        onclick="setRankMode('value')"
        title="Quality per rupee"
    >
        <span data-icon="indian-rupee"></span>Value
    </button>
    <button
        class="rank-tab"
        id="rank-commute"
        onclick="setRankMode('commute')"
        title="Easy commute to your places of interest"
    >
        <span data-icon="route"></span>Commute
    </button>
</div>
