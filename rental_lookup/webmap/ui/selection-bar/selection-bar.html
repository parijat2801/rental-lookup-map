<div class="floating-bar" id="selection-bar" hidden>
    <span id="selection-count"></span>
    <span class="divider"></span>
    <button onclick="starBoxSelection()">
        <span data-icon="star"></span
        ><span id="selection-star-label">Star all</span>
    </button>
    <button onclick="dismissBoxSelection()">
        <span data-icon="eye-off"></span>Dismiss all
    </button>
    <button onclick="clearBoxSelection()" aria-label="Clear selection">
        <span data-icon="x"></span>
    </button>
</div>
