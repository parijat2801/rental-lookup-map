<header class="sidebar-header">
    <div>
        <h1>Rentals in Bangalore</h1>
        <p class="subtitle" id="result-summary">&nbsp;</p>
    </div>
    <div class="header-actions">
        <button
            class="icon-button sidebar-collapse-button"
            id="sidebar-collapse-button"
            title="Collapse sidebar"
            aria-label="Collapse sidebar"
            onclick="toggleSidebar()"
        >
            <span data-icon="panel-left-close"></span>
        </button>
        <button
            class="icon-button"
            id="theme-toggle"
            title="Switch theme"
            aria-label="Switch theme"
            onclick="toggleTheme()"
        >
            <span data-icon="moon"></span>
        </button>
        <button
            class="icon-button"
            title="Keyboard shortcuts"
            aria-label="Keyboard shortcuts"
            onclick="toggleShortcuts(true)"
        >
            <span data-icon="keyboard"></span>
        </button>
        <button
            class="icon-button"
            id="settings-button"
            title="Settings"
            aria-label="Settings"
            onclick="toggleSettings(true)"
        >
            <span data-icon="settings"></span>
        </button>
    </div>
</header>
