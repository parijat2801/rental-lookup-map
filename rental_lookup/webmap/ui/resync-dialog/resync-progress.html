<div
    class="resync-progress"
    id="resync-progress"
    hidden
    role="status"
    aria-live="polite"
    aria-atomic="true"
>
    <div class="resync-progress-head">
        <span class="resync-progress-icon" data-icon="refresh-cw"></span>
        <div class="resync-progress-copy">
            <div class="resync-progress-title">Resyncing listings</div>
            <div class="resync-progress-step" id="resync-progress-step">
                Starting…
            </div>
        </div>
    </div>
    <div
        class="resync-progress-track"
        aria-hidden="true"
    >
        <div class="resync-progress-fill" id="resync-progress-fill"></div>
    </div>
    <div class="resync-progress-meta" id="resync-progress-meta"></div>
</div>
