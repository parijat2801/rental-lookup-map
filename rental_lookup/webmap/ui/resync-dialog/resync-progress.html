<div
    class="resync-progress"
    id="resync-progress"
    hidden
    role="status"
    aria-live="polite"
    aria-atomic="true"
>
    <div class="resync-progress-row">
        <span class="resync-progress-icon"
            ><span data-icon="refresh-cw"></span
        ></span>
        <span class="resync-progress-label" id="resync-progress-step"
            >Starting…</span
        >
    </div>
    <div
        class="resync-progress-track"
        aria-hidden="true"
    >
        <div class="resync-progress-fill" id="resync-progress-fill"></div>
    </div>
</div>
