name: Update Rental Map

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'  # 8am IST (2:30 UTC)
  workflow_dispatch:  # manual trigger from Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx osmnx geopandas geopy pandas tqdm shapely

      - name: Restore cached data
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/raw_prev
          key: rental-data-${{ github.run_number }}
          restore-keys: |
            rental-data-

      - name: Fetch NoBroker listings
        run: |
          rm -rf data/raw
          mkdir -p data/raw
          python3 -m rental_lookup

      - name: Fetch MagicBricks listings
        run: |
          mkdir -p data/raw_mb
          rm -rf data/raw_mb
          mkdir -p data/raw_mb
          python3 -m rental_lookup.magicbricks

      - name: Sync stars (published stars.json + repo cache → merge)
        run: |
          mkdir -p data/cache

          # Published stars.json on gh-pages is the canonical shared copy — it is
          # what the deployed page reads, and the Deploy step below republishes it.
          curl -sf "https://parijat2801.github.io/rental-lookup-map/stars.json" -o /tmp/stars_published.json || echo '' > /tmp/stars_published.json
          cp data/cache/stars_and_dismissals.json /tmp/stars_cached.json 2>/dev/null || echo '' > /tmp/stars_cached.json

          # Merge using tested module (handles corrupted JSON safely)
          python3 -c "
          import json
          from rental_lookup.star_merge import load_json_safe, merge_stars

          sources = []
          for f in ['/tmp/stars_published.json', '/tmp/stars_cached.json']:
              try:
                  sources.append(load_json_safe(open(f).read()))
              except FileNotFoundError:
                  sources.append({})

          merged = merge_stars(sources)
          if not merged['starred'] and not merged['dismissed']:
              raise SystemExit('Refusing to publish empty stars — all sources were unreadable')

          with open('data/cache/stars_and_dismissals.json', 'w') as f:
              json.dump(merged, f, indent=2)

          print(f'Merged: {len(merged[\"starred\"])} starred, {len(merged[\"dismissed\"])} dismissed')
          "

      - name: Build map
        run: |
          mkdir -p output
          python3 build_map.py

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp output/map.html /tmp/map.html
          cp data/cache/stars_and_dismissals.json /tmp/stars.json
          git stash --include-untracked || true
          git checkout gh-pages
          git reset --hard origin/gh-pages
          cp /tmp/map.html index.html
          cp /tmp/stars.json stars.json
          git add index.html stars.json
          git commit -m "Update map $(date -u +%Y-%m-%d)" || echo "No changes"
          git push origin gh-pages
