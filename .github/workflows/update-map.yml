name: Update Rental Map

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'  # 8am IST (2:30 UTC)
  workflow_dispatch:  # manual trigger from Actions tab

# Never run two deploys at once (they would race on gh-pages).
concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      # The cache restore below overwrites data/cache, so keep the committed stars for the merge.
      - name: Keep repo stars
        run: cp data/cache/stars_and_dismissals.json /tmp/stars_repo.json 2>/dev/null || true

      - name: Restore cached data
        uses: actions/cache@v6
        with:
          path: |
            data/cache
            data/raw
            data/raw_prev
          key: rental-data-${{ github.run_number }}
          restore-keys: |
            rental-data-

      - name: Fetch NoBroker listings
        run: |
          # Last run's listings become raw_prev, used to show delisted listings on the map.
          if compgen -G "data/raw/*.json" > /dev/null; then
            rm -rf data/raw_prev
            mv data/raw data/raw_prev
          fi
          rm -rf data/raw
          mkdir -p data/raw
          python -m rental_lookup

      - name: Fetch MagicBricks listings
        run: |
          rm -rf data/raw_mb
          python -m rental_lookup.sources.magicbricks

      - name: Sync stars (published stars.json + cache + repo → merge)
        run: |
          # Published stars.json on gh-pages is the canonical shared copy — it is
          # what the deployed page reads, and the Deploy step below republishes it.
          curl -sf "https://parijat2801.github.io/rental-lookup-map/stars.json" -o /tmp/stars_published.json || true
          cp data/cache/stars_and_dismissals.json /tmp/stars_cached.json 2>/dev/null || true
          python -m rental_lookup.stars data/cache/stars_and_dismissals.json \
            /tmp/stars_published.json /tmp/stars_cached.json /tmp/stars_repo.json

      - name: Build map
        env:
          CARTO_BASEMAPS_KEY: ${{ secrets.CARTO_BASEMAPS_KEY }}
        run: python -m rental_lookup.webmap.builder

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp output/map.html /tmp/map.html
          cp data/cache/stars_and_dismissals.json /tmp/stars.json
          git stash --include-untracked || true
          git checkout gh-pages
          git reset --hard origin/gh-pages
          cp /tmp/map.html index.html
          cp /tmp/stars.json stars.json
          git add index.html stars.json
          git commit -m "Update map $(date -u +%Y-%m-%d)" || echo "No changes"
          git push origin gh-pages
