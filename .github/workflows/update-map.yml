name: Update blr-rental-map

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'  # 8am IST (2:30 UTC)
  workflow_dispatch:  # manual trigger from Actions tab

# Never run two deploys at once (they would race on gh-pages).
concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python3 -m pip install -e '.[dev]'

      - name: Run tests
        run: python3 -m pytest -q

      - name: Restore cached data
        uses: actions/cache@v6
        with:
          path: |
            data/cache
            data/raw_nb
            data/raw_nb_prev
            data/raw_pa
          key: rental-data-${{ github.run_number }}
          restore-keys: |
            rental-data-

      # Stars are personal (browser localStorage / local disk only) — never publish them.
      - name: Drop personal stars from cache
        run: rm -f data/cache/stars_and_dismissals.json

      - name: Fetch NoBroker listings
        run: |
          # Last run's listings become raw_nb_prev, used to show delisted listings on the map.
          if compgen -G "data/raw_nb/*.json" > /dev/null; then
            rm -rf data/raw_nb_prev
            mv data/raw_nb data/raw_nb_prev
          fi
          rm -rf data/raw_nb
          mkdir -p data/raw_nb
          python3 -m rental_lookup.sources nobroker

      - name: Fetch MagicBricks listings
        run: |
          rm -rf data/raw_mb
          python3 -m rental_lookup.sources magicbricks

      - name: Fetch 99acres listings
        run: |
          rm -rf data/raw_9a
          python3 -m rental_lookup.sources 99acres

      # data/raw_pa is cached: only properties new since the last run are fetched (the API is rate-limited).
      - name: Fetch Property Angel listings
        run: python3 -m rental_lookup.sources propertyangel

      - name: Build map
        env:
          CARTO_BASEMAPS_KEY: ${{ secrets.CARTO_BASEMAPS_KEY }}
        run: python3 -m rental_lookup.webmap.builder

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp output/map.html /tmp/map.html
          git stash --include-untracked || true
          git checkout gh-pages
          git reset --hard origin/gh-pages
          cp /tmp/map.html index.html
          git rm -f stars.json 2>/dev/null || true
          git add index.html
          git commit -m "Update map $(date -u +%Y-%m-%d)" || echo "No changes"
          git push origin gh-pages
